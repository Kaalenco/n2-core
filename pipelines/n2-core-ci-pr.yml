trigger: none

pr:
  branches:
    include:
    - '*'
  paths:
    include:
    - src/N2.*/**
    exclude:
    - docs/**
    - '*.md'

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

stages:

- stage: CI
  displayName: Build and test
  jobs:
  - job: Build
    displayName: Build and test
    steps:

    - task: UseDotNet@2
      displayName: Use .NET 8
      inputs:
        version: '8.0.x'

    - task: UseDotNet@2
      displayName: Use .NET 10
      inputs:
        version: '10.0.x'

    - task: NuGetAuthenticate@1
      displayName: Authenticate NuGet feeds

    - task: DotNetCoreCLI@2
      displayName: Restore packages
      inputs:
        command: restore
        projects: 'src/**/*.csproj'
        feedsToUse: config
        nugetConfigPath: 'src/nuget.config'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/**/*.csproj'
        arguments: '--no-restore --configuration $(buildConfiguration) /p:GeneratePackageOnBuild=false'

    - task: DotNetCoreCLI@2
      displayName: Run unit tests
      inputs:
        command: test
        projects: 'src/**/*.UnitTests.csproj'
        arguments: >-
          --no-build
          --configuration $(buildConfiguration)
          --collect:"XPlat Code Coverage"
        publishTestResults: true
      env:
        ENV__Secret__Value: NotSoSecret

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      condition: always()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

    - pwsh: |
        $retainUntil = (Get-Date).AddDays(7).ToUniversalTime().ToString("o")
        $uri = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)$($env:SYSTEM_TEAMPROJECTID)/_apis/build/retention/leases?api-version=7.1"
        $body = ConvertTo-Json -Compress -InputObject @(
          @{
            ownerId         = "Pipeline:$($env:SYSTEM_DEFINITIONID)"
            definitionId    = [int]$env:SYSTEM_DEFINITIONID
            runId           = [int]$env:BUILD_BUILDID
            retainUntil     = $retainUntil
            protectPipeline = $false
          }
        )
        Invoke-RestMethod -Method Post -Uri $uri `
          -Headers @{ Authorization = "Bearer $($env:SYSTEM_ACCESSTOKEN)" } `
          -ContentType 'application/json' -Body $body
      displayName: Retain successful run for 7 days
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
