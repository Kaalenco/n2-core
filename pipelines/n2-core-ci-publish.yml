# Prerequisite (one-time, Azure DevOps admin):
#   Artifacts → vault-packages → Feed settings → Permissions
#   Add "[Project] Build Service ([Org])" with role Contributor.

trigger:
  branches:
    include:
    - trunk
  paths:
    include:
    - src/N2.*/**
    exclude:
    - docs/**
    - '*.md'

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

stages:

- stage: CI
  displayName: Build and test
  jobs:
  - job: Build
    displayName: Build, test, and pack
    steps:

    - task: UseDotNet@2
      displayName: Use .NET 8
      inputs:
        version: '8.0.x'

    - task: UseDotNet@2
      displayName: Use .NET 10
      inputs:
        version: '10.0.x'

    - task: NuGetAuthenticate@1
      displayName: Authenticate NuGet feeds

    - task: DotNetCoreCLI@2
      displayName: Restore packages
      inputs:
        command: restore
        projects: 'src/**/*.csproj'
        feedsToUse: config
        nugetConfigPath: 'src/nuget.config'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/**/*.csproj'
        arguments: '--no-restore --configuration $(buildConfiguration) /p:GeneratePackageOnBuild=false'

    - task: DotNetCoreCLI@2
      displayName: Run unit tests
      inputs:
        command: test
        projects: 'src/**/*.UnitTests.csproj'
        arguments: >-
          --no-build
          --configuration $(buildConfiguration)
          --collect:"XPlat Code Coverage"
        publishTestResults: true
      env:
        ENV__Secret__Value: NotSoSecret

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      condition: always()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'

    - task: DotNetCoreCLI@2
      displayName: Pack
      inputs:
        command: pack
        packagesToPack: 'src/N2.Core/N2.Core.csproj'
        configuration: '$(buildConfiguration)'
        nobuild: true
        outputDir: '$(Build.ArtifactStagingDirectory)/packages'

    - task: PublishBuildArtifacts@1
      displayName: Publish packages artifact
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/packages'
        ArtifactName: packages

    - pwsh: |
        $uri = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)$($env:SYSTEM_TEAMPROJECTID)/_apis/build/retention/leases?api-version=7.1"
        $body = ConvertTo-Json -Compress -InputObject @(
          @{
            ownerId         = "Pipeline:$($env:SYSTEM_DEFINITIONID)"
            definitionId    = [int]$env:SYSTEM_DEFINITIONID
            runId           = [int]$env:BUILD_BUILDID
            daysValid       = 30
            protectPipeline = $false
          }
        )
        Invoke-RestMethod -Method Post -Uri $uri `
          -Headers @{ Authorization = "Bearer $($env:SYSTEM_ACCESSTOKEN)" } `
          -ContentType 'application/json' -Body $body
      displayName: Retain successful run for 30 days
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: CodeAnalysis
  displayName: Code analysis
  dependsOn: CI
  jobs:
  - job: Analyse
    displayName: Coverage and complexity
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      COVERAGE_DIR: '$(Agent.TempDirectory)'
    steps:

    - task: UseDotNet@2
      displayName: Use .NET 8
      inputs:
        version: '8.0.x'

    - task: UseDotNet@2
      displayName: Use .NET 10
      inputs:
        version: '10.0.x'

    - task: NuGetAuthenticate@1
      displayName: Authenticate NuGet feeds

    - task: DotNetCoreCLI@2
      displayName: Restore packages
      inputs:
        command: restore
        projects: 'src/**/*.csproj'
        feedsToUse: config
        nugetConfigPath: 'src/nuget.config'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/**/*.csproj'
        arguments: '--no-restore /p:GeneratePackageOnBuild=false'

    - task: DotNetCoreCLI@2
      displayName: Run unit tests with coverage
      inputs:
        command: test
        projects: 'src/**/*.UnitTests.csproj'
        arguments: >-
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
      env:
        Logging__LogLevel__Default: Error
        ENV__Secret__Value: NotSoSecret

    - script: dotnet tool install --global dotnet-reportgenerator-globaltool
      displayName: Install ReportGenerator

    - script: |
        reportgenerator \
          -reports:"$(COVERAGE_DIR)/**/coverage.cobertura.xml" \
          -targetdir:reports/coverage \
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura"
      displayName: Generate HTML coverage report

    - task: PublishCodeCoverageResults@2
      displayName: Publish coverage to pipeline
      condition: always()
      inputs:
        summaryFileLocation: reports/coverage/Cobertura.xml
        reportDirectory: reports/coverage

    - bash: pip install lizard
      displayName: Install lizard

    - bash: |
        mkdir -p reports/complexity
        lizard src/ -x "*.UnitTests" -C 10 --html > reports/complexity/index.html
      displayName: Generate complexity report

    - bash: |
        SUMMARY_FILE="$(Agent.TempDirectory)/code-analysis-summary.md"
        PIPELINE_SUMMARY_FILE="$SUMMARY_FILE" python3 scripts/az-code-analysis-summary.py \
          --source src/ \
          --exclude "*.UnitTests" \
          --coverage-dir $COVERAGE_DIR
        echo "##vso[task.uploadsummary]$SUMMARY_FILE"
      displayName: Write pipeline summary
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: Upload analysis reports
      condition: always()
      inputs:
        PathtoPublish: reports/
        ArtifactName: code-analysis

- stage: Publish
  displayName: Publish to vault-packages
  dependsOn: CI
  condition: >-
    and(
      succeeded('CI'),
      eq(variables['Build.SourceBranch'], 'refs/heads/trunk'),
      ne(variables['Build.Reason'], 'PullRequest')
    )
  jobs:
  - job: Push
    displayName: Push to private feed
    steps:

    - task: DownloadBuildArtifacts@1
      displayName: Download packages artifact
      inputs:
        buildType: current
        artifactName: packages
        downloadPath: '$(Pipeline.Workspace)'

    - task: NuGetAuthenticate@1
      displayName: Authenticate NuGet feeds

    - pwsh: |
        $packages = Get-ChildItem "$(Pipeline.Workspace)/packages" -Filter "*.nupkg" -Recurse |
          Where-Object { $_.Name -notlike "*.symbols.nupkg" }
        foreach ($pkg in $packages) {
          Write-Host "Pushing $($pkg.Name)"
          dotnet nuget push $pkg.FullName `
            --source $env:FEED_URL `
            --api-key AzureArtifacts `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
      displayName: Push to vault-packages
      env:
        FEED_URL: https://pkgs.dev.azure.com/gjkaal/3b3decf8-eba1-45d0-b47a-d9c1ce84f739/_packaging/vault-packages/nuget/v3/index.json

    - pwsh: |
        $uri = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)$($env:SYSTEM_TEAMPROJECTID)/_apis/build/retention/leases?api-version=7.1"
        $body = ConvertTo-Json -Compress -InputObject @(
          @{
            ownerId         = "Pipeline:$($env:SYSTEM_DEFINITIONID):published"
            definitionId    = [int]$env:SYSTEM_DEFINITIONID
            runId           = [int]$env:BUILD_BUILDID
            daysValid       = 365
            protectPipeline = $false
          }
        )
        Invoke-RestMethod -Method Post -Uri $uri `
          -Headers @{ Authorization = "Bearer $($env:SYSTEM_ACCESSTOKEN)" } `
          -ContentType 'application/json' -Body $body
      displayName: Retain published run for 365 days
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
